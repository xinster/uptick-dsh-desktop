<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>服务不可用 — DeepSeek Harness Desktop</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0d0d0d; color: #ececec;
           font-family: -apple-system, "PingFang SC", sans-serif; }
    .box { max-width: 460px; text-align: center; line-height: 1.8; }
    .logo { font-size: 40px; color: #4d6bfe; }
    h1 { font-size: 18px; margin: 12px 0 8px; }
    p { color: #9a9aa0; font-size: 13px; margin: 4px 0; }
    .detail { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #6b6b6b; word-break: break-all; }
    button { margin-top: 16px; padding: 8px 18px; border: none; border-radius: 8px; background: #4d6bfe;
             color: #fff; font-size: 13px; cursor: pointer; }
    button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">◆</div>
    <h1>DeepSeek Harness 服务不可用</h1>
    <p>本地服务未能启动或已停止。</p>
    <p class="detail" id="desc"></p>
    <button onclick="location.reload()">重试</button>
  </div>
  <script>
    try {
      const p = new URLSearchParams(location.search);
      document.getElementById('desc').textContent = p.get('desc') || p.get('code') || '';
    } catch {}
  </script>
</body>
</html>
